name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXT_PUBLIC_FIREBASE_API_KEY: mock-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mock-project.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: mock-project
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: http://127.0.0.1:9000?ns=mock-project-default-rtdb
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abcdef
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: http://127.0.0.1:9099
      NEXT_PUBLIC_FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1
      NEXT_PUBLIC_FIREBASE_DATABASE_EMULATOR_PORT: '9000'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
      FIREBASE_PROJECT_ID: mock-project
      FIREBASE_DATABASE_URL: http://127.0.0.1:9000?ns=mock-project-default-rtdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21 (for Firebase Local Emulator Suite)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Validate game scenarios content
        run: npm run validate:content

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Unit & Integration Tests (Vitest with Firebase Emulators)
        run: |
          firebase emulators:exec --project mock-project --only auth,database "npm test"

      - name: Build Next.js application
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run Playwright E2E Tests (with Firebase Emulators)
        run: |
          firebase emulators:exec --project mock-project --only auth,database "npx playwright test"

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
